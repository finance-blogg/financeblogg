<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#e8e0d2"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1080" cy="90" r="190" fill="#e8e0d2"/>
<circle cx="110" cy="590" r="150" fill="#e8e0d2"/>
<rect x="80" y="70" width="1040" height="490" rx="28" fill="#ffffff" stroke="#d4cbb8" stroke-width="2"/>
<rect x="80" y="70" width="14" height="490" rx="7" fill="#2a9d8f"/>
<!-- balance scale -->
<line x1="600" y1="160" x2="600" y2="420" stroke="#0b1f3a" stroke-width="14" stroke-linecap="round"/>
<line x1="360" y1="260" x2="840" y2="260" stroke="#1e3a5f" stroke-width="12" stroke-linecap="round"/>
<!-- left pan - volatility -->
<path d="M300 280 h160 l-20 90 h-120 z" fill="#f5f0e6" stroke="#1e3a5f" stroke-width="4"/>
<polyline points="320,320 350,300 380,330 410,290 440,310" fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/>
<!-- right pan - calm -->
<path d="M740 280 h160 l-20 90 h-120 z" fill="#f5f0e6" stroke="#2a9d8f" stroke-width="4"/>
<circle cx="820" cy="330" r="28" fill="#0b1f3a"/>
<circle cx="820" cy="330" r="12" fill="#2a9d8f"/>
<!-- base -->
<rect x="520" y="420" width="160" height="28" rx="10" fill="#0b1f3a"/>
<rect x="480" y="460" width="240" height="20" rx="8" fill="#1e3a5f"/>
</svg>
