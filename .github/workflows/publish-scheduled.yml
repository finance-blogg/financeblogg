# Optional: runs the scheduled-publishing job every 15 minutes.
#
# Vercel's Hobby plan only allows a daily cron (see vercel.json). If you need
# scheduled articles to go live closer to their time, add these repository
# secrets in GitHub (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://www.financeblogg.com
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
# Without both secrets the job exits without doing anything.
# GitHub may delay scheduled workflows by several minutes under load.

name: Publish scheduled articles

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the publishing endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish-scheduled"
